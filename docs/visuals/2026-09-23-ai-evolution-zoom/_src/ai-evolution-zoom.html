  <label>Zoom <input id="z" type="range" min="0" max="1" step="0.001" value="0"> <span id="lbl"></span></label>
</main>
<script>
// The three sketches are nested: fig1 (agent development) sits inside the "Agent development" box of
// fig2 (lab optimisation), which sits inside the "Lab A optimisation" box of fig3 (public optimisation).
// The slider sets the viewBox height on a log scale; t = 0, 0.5, 1 frame fig1, fig2, fig3.
const H = [12.467, 138.139, 1136.191];                 // viewBox heights per stage
const C = [[194.920,158.222], [223.500,198.500], [553.085,535.939]];  // centres per stage
const fig = document.getElementById('fig'), z = document.getElementById('z'), lbl = document.getElementById('lbl');
const names = ['Agent development', 'Lab optimisation', 'Public optimisation'];
const lerp = (a,b,t) => a + (b-a)*t;
const fade = (h, lo, hi) => Math.min(1, Math.max(0, (Math.log(h)-Math.log(lo)) / (Math.log(hi)-Math.log(lo))));
function view(t){
  const i = t < 0.5 ? 0 : 1, u = (t - i*0.5) * 2;
  const h = Math.exp(lerp(Math.log(H[i]), Math.log(H[i+1]), u));
  const s = (h - H[i]) / (H[i+1] - H[i]);
  const cx = lerp(C[i][0], C[i+1][0], s), cy = lerp(C[i][1], C[i+1][1], s), w = h * 4/3;
  fig.setAttribute('viewBox', `${cx-w/2} ${cy-h/2} ${w} ${h}`);
  // cross-fade: the nested sketch dissolves and the box's handwritten label takes over; box outlines stay
  const k1 = fade(h, 2.2*H[0], 5.5*H[0]), k2 = fade(h, 2.2*H[1], 5.0*H[1]);
  fig.querySelector('#fig1').style.opacity = 1 - k1;
  fig.querySelector('.label2').style.opacity = k1;
  fig.querySelector('#fig2').style.opacity = 1 - k2;
  fig.querySelector('.label3').style.opacity = k2;
  lbl.textContent = names[Math.round(t*2)];
}
z.addEventListener('input', () => view(+z.value));
view(0);
</script>
