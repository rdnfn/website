<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mechanisms of AI evolution</title>
<style>
  /* Colours and shapes mirror the site's PaperMod theme (theme-vars.css); dark mode follows the parent page. */
  :root {
    --theme: rgb(255, 255, 255);
    --entry: rgb(255, 255, 255);
    --primary: rgb(30, 30, 30);
    --secondary: rgb(108, 108, 108);
    --tertiary: rgb(214, 214, 214);
    --border: rgb(238, 238, 238);
    --ink: #000;
    --radius: 8px;
    --gap: 24px;
  }
  :root.dark {
    --theme: rgb(29, 30, 32);
    --entry: rgb(46, 46, 51);
    --primary: rgb(218, 218, 219);
    --secondary: rgb(155, 156, 157);
    --tertiary: rgb(65, 66, 68);
    --border: rgb(51, 51, 51);
    --ink: rgb(218, 218, 219);
  }
  html, body { margin: 0; height: 100%; background: var(--theme); color: var(--primary); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    overflow: hidden;
    /* touch: the page scrolls and zooms as usual; the story is moved with the controls */
  }
  /* The sketch fills the window, so zooms pass behind the control card; each scene is fitted into the area above it */
  #stage { position: fixed; inset: 0; overflow: hidden; }
  /* The moving parts live in their own svg (#fx) on its own layer, so the drawing isn't repainted every frame */
  #stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; will-change: transform; }
  #fx { pointer-events: none; }
  #stage path[stroke="#000000"] { stroke: var(--ink); }
  #stage circle[fill="#000000"] { fill: var(--ink); }
</style>
<!-- The control card's own styles, all under .controls: on the site, layout() may copy them into the page -->
<style id="controls-style">
  /* Control card: same look as the site's visual info box */
  .controls {
    position: fixed;
    left: 50%;
    bottom: var(--gap);
    transform: translateX(-50%);
    width: min(440px, 100vw - var(--gap) * 2);
    box-sizing: border-box;
    padding: 12px 16px 10px;
    background: var(--entry);
    color: var(--primary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    font-size: 13px;
    line-height: normal;
  }
  /* Top row: play, and the options (loop, zoom, speed) together at the right; the timeline in a row of its own */
  .controls .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 10px; margin-bottom: 6px; }
  .controls .opts { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .controls #play, .controls #loop {
    flex: none; display: grid; place-items: center; width: 24px; height: 24px; padding: 0;
    color: var(--primary); background: none; border: none; border-radius: 50%; cursor: pointer;
  }
  .controls #play:hover, .controls #loop:hover { background: var(--border); }
  .controls #play:focus-visible, .controls #loop:focus-visible { outline: 2px solid var(--secondary); outline-offset: 2px; }
  .controls #play svg { display: block; width: 12px; height: 12px; fill: currentColor; }
  .controls #loop { color: var(--secondary); }
  .controls #loop[aria-pressed=true] { color: var(--primary); background: var(--border); }
  .controls #loop svg { display: block; width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  /* Menus: compact, with their own chevron (and, for zoom, a magnifier) */
  .controls .pick { position: relative; flex: none; display: flex; color: var(--secondary); }
  .controls .pick:hover { color: var(--primary); }
  .controls .pick::after {
    content: ""; position: absolute; right: 7px; top: 50%; width: 4px; height: 4px; margin-top: -4px; pointer-events: none;
    border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg);
  }
  .controls .pick svg {
    position: absolute; left: 6px; top: 50%; width: 10px; height: 10px; margin-top: -5px; pointer-events: none;
    fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round;
  }
  .controls .pick select {
    -webkit-appearance: none; appearance: none; margin: 0; font: inherit; font-size: 12px; line-height: 16px;
    color: inherit; color-scheme: light; background: var(--entry); border: 1px solid var(--border); border-radius: 4px;
    padding: 3px 17px 3px 7px; cursor: pointer;
  }
  .controls .pick #zoom { padding-left: 20px; }
  .dark .controls .pick select { color-scheme: dark; }
  .controls .pick select:focus-visible { outline: 2px solid var(--secondary); outline-offset: 2px; }
  /* Timeline: one chapter per stage, named where it sits, and between chapters a dotted bridge for the zoom out to
     the next stage. --track (set by the script) lays out chapters and bridges along the rail and under it alike. */
  .controls .chapters { order: 1; flex: 1 0 100%; min-width: 0; display: grid; grid-template-columns: var(--track); grid-template-rows: 16px auto; row-gap: 6px; }
  .controls .rail { grid-column: 1 / -1; grid-row: 1; position: relative; display: grid; grid-template-columns: var(--track); cursor: pointer; touch-action: none; border-radius: 2px; }
  .controls .rail:focus-visible { outline: 2px solid var(--secondary); outline-offset: 4px; }
  .controls .seg, .controls .bridge { position: relative; align-self: center; height: 4px; overflow: hidden; }
  .controls .seg { border-radius: 2px; background: var(--tertiary); }
  .controls .seg i { position: absolute; inset: 0; background: var(--primary); transform-origin: left; transform: scaleX(var(--f, 0)); }
  .controls .bridge, .controls .bridge i { background: radial-gradient(circle, var(--tertiary) 1.3px, transparent 1.8px) center / 6px 4px repeat-x; }
  .controls .bridge i { position: absolute; inset: 0; background-image: radial-gradient(circle, var(--primary) 1.3px, transparent 1.8px); clip-path: inset(0 calc((1 - var(--f, 0)) * 100%) 0 0); }
  .controls .thumb {
    position: absolute; left: calc(var(--pos, 0) * 100%); top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
    box-sizing: border-box; border-radius: 50%; background: var(--primary); border: 2px solid var(--entry); pointer-events: none;
  }
  .controls .chapters button {
    grid-row: 2; grid-column: 1; align-self: start; min-width: 0; font: inherit; line-height: 1.25; text-align: left;
    color: var(--secondary); background: none; border: none; padding: 0; cursor: pointer;
  }
  .controls .chapters button:nth-of-type(2) { grid-column: 3; }
  .controls .chapters button:nth-of-type(3) { grid-column: 5; }
  .controls .chapters button { display: grid; }
  .controls .chapters .name { grid-area: 1 / 1; }
  .controls .chapters .ghost { visibility: hidden; font-weight: 600; }
  .controls .chapters button:hover { color: var(--primary); }
  .controls .chapters button[aria-pressed=true] { color: var(--primary); font-weight: 600; }
  .controls .chapters small { display: block; font-size: 11px; font-weight: normal; }
  .controls .hint { text-align: center; color: var(--secondary); font-size: 12px; font-style: italic; margin-top: 4px; }
  @media (max-width: 480px), (max-height: 560px) { .controls .hint { display: none; } }
  /* On landscape windows, layout() may move the card to the right, where it costs width instead of height; on the
     site, it moves it out of the visual to the page's left column instead, under the info box. There, and in narrow
     cards, the timeline gets a row of its own. */
  .controls.side { left: auto; right: var(--gap); transform: none; width: 232px; }
  .controls.docked { position: static; transform: none; width: auto; }
  .controls.side .bar { margin-bottom: 10px; }
  .controls.side .hint { text-align: left; }
  /* In the side card, the timeline runs down beside the stages' names */
  .controls.side:not(.mini) .chapters { grid-template-columns: 24px 1fr; grid-template-rows: var(--track); column-gap: 10px; row-gap: 0; } /* rail under the play button */
  .controls.side:not(.mini) .rail { grid-column: 1; grid-row: 1 / -1; grid-template-columns: none; grid-template-rows: var(--track); }
  .controls.side:not(.mini) .seg, .controls.side:not(.mini) .bridge { align-self: stretch; justify-self: center; width: 4px; height: auto; }
  .controls.side:not(.mini) .seg i { transform-origin: top; transform: scaleY(var(--f, 0)); }
  .controls.side:not(.mini) .bridge, .controls.side:not(.mini) .bridge i { background-size: 4px 6px; background-repeat: repeat-y; }
  .controls.side:not(.mini) .bridge i { clip-path: inset(0 0 calc((1 - var(--f, 0)) * 100%) 0); }
  .controls.side:not(.mini) .thumb { left: 50%; top: calc(var(--pos, 0) * 100%); }
  .controls.side:not(.mini) .chapters button { grid-column: 2; grid-row: 1; align-self: stretch; min-height: 44px; }
  .controls.side:not(.mini) .chapters button:nth-of-type(2) { grid-row: 3; }
  .controls.side:not(.mini) .chapters button:nth-of-type(3) { grid-row: 5; }
  /* Short windows: only the current stage is named, under the whole timeline */
  .controls.side.mini:not(.docked) { width: 232px; }
  .controls.mini .chapters button { grid-column: 1 / -1; }
  .controls.mini .chapters button:not([aria-pressed=true]) { display: none; }
  .controls.mini .chapters small { display: inline; }
  .controls.mini.docked { padding: 10px 12px 8px; }
  .controls.mini .bar { column-gap: 6px; }
  .controls.mini .opts { gap: 4px; }
  .controls.mini .pick select { padding: 3px 14px 3px 5px; }
  .controls.mini .pick #zoom { padding-left: 17px; }
  .controls.mini .pick svg { left: 5px; }
  .controls.mini .pick::after { right: 5px; }
</style>
</head>

  const under = { mode: '', a: { left: 12, top: 16, right: W - 12, bottom: measure('').top - 16 } };
  const side = besideInfo()
    ? { mode: ' side docked', a: { left: 12, top: 16, right: W - 12, bottom: H - 16 } }
    : { mode: ' side', a: { left: 12, top: 16, right: measure(' side').left - 16, bottom: H - 16 } };
  if (card !== controls) card.remove();
  // the side only if no scene comes out smaller there and together they gain
  [under, side].forEach(o => o.fits = fit(o.a));
  const gain = side.fits.map((f, k) => f / under.fits[k]);
  const best = Math.min(...gain) >= 0.98 && gain.reduce((m, g) => m * g, 1) >= 1.05 ? side : under;
  controls.className = 'controls' + best.mode + mini;
  if (best.mode.includes('docked') !== docked) {
    docked = !docked;
    const mine = document.getElementById('controls-style'), theirs = parent.document.getElementById('controls-style');
    if (docked && theirs?.textContent !== mine.textContent) { // the page's copy, from this or an earlier load
      theirs?.remove();
      parent.document.head.appendChild(mine.cloneNode(true));
    }
    (docked ? host : document.body).appendChild(controls);
  }
  area = Math.min(...best.fits) > 0 ? best.a : null;
  viewed = null;
  view(zoomAt(time), time);
}
addEventListener('resize', layout);
new ResizeObserver(layout).observe(controls);
// Phones start zoomed in on the action (touch screens under 600 px on their short side; not tablets)
if (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600) zoomPick.value = '1.5';
layout();
setTime(0);
// By default the story plays on its own, looping, a second after the page loads: unless it has been played, moved
// or paused by then, or the reader asks for reduced motion.
if (!matchMedia('(prefers-reduced-motion: reduce)').matches)
  setTimeout(() => { if (!playing && time === 0 && back === null) run(1); }, 1000);
</script>
